<style>

.tools{display:flex;gap:8px;direction:ltr;flex-wrap:wrap;margin-top:8px}

/* ---------- الدرس ---------- */
let L,step,sel,ordered,checked,xpGain,hearts,ranOk=false,lastOut='',fails=0;
function startLesson(id){L=flat.find(l=>l.id===id);if(L.steps.some(s=>s.t==='run'))loadPy().catch(()=>{});step=0;xpGain=0;hearts=3;render()}
function heartsTxt(){return ''}
function render(){
  const s=L.steps[step];sel=null;ordered=[];checked=false;ranOk=false;lastOut='';fails=0;
  let b='';
  if(s.t==='teach'){
    b=`${s.e?`<div class="big-e">${s.e}</div>`:''}<h3>${tr(s.h)}</h3>${s.p.map(x=>`<p>${tr(x)}</p>`).join('')}${s.code?`<pre>${esc(s.code)}</pre>`:''}`;
  }else if(s.t==='mcq'){
    b=`<h3>${tr(s.q)}</h3>${s.code?`<pre>${esc(s.code)}</pre>`:''}${s.opts.map((o,i)=>`<button class="opt ${s.ltr?'ltr':''}" id="o${i}" onclick="pick(${i})">${esc(tr(o))}</button>`).join('')}`;
  }else if(s.t==='blank'){
    const c=esc(s.code).replace('___','<span class="blank" id="bl">&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    b=`<h3>${tr(s.q)}</h3><pre>${c}</pre><div class="chips">${s.opts.map((o,i)=>`<button class="chip2" id="o${i}" onclick="pickB(${i})">${esc(o)}</button>`).join('')}</div>`;
  }else if(s.t==='order'){
    const t=[...s.tokens].sort(()=>Math.random()-.5);
    b=`<h3>${tr(s.q)}</h3><div class="answer" id="ans"></div><div class="tokens" id="toks">${t.map(x=>`<button class="tok">${esc(x)}</button>`).join('')}</div>`;
  }else if(s.t==='run'){
    b=`<h3>${tr(s.q)}</h3><textarea class="ed" id="ed" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">${esc(s.starter)}</textarea>
    <div class="tools"><button onclick="ins('    ')">⇥ Tab</button><button onclick="ins('(')">(</button><button onclick="ins(')')">)</button><button onclick="ins('&quot;')">"</button><button onclick="ins(':')">:</button><button onclick="ins('[')">[</button><button onclick="ins(']')">]</button></div>
    <div><button class="runbtn" onclick="runCode()">▶ ${U('شغّل','Run')}</button><button class="hintbtn" onclick="showHint()">💡 ${U('تلميح','Hint')}</button></div><div id="hintbox"></div><div class="out" id="out">${U('النتيجة هتظهر هنا','The result appears here')}</div><div class="hint" id="pystat"></div>`;
  }
  const n=L.steps.length;
  const ui=UNITS.findIndex(u=>u.lessons.includes(L));
  shell(`<div class="stage"><div class="st1">${tr(UNITS[ui].title)}</div><div class="st2">${tr(L.title)}</div><div class="scrub"><i style="width:${(step+1)/n*100}%"></i></div><div class="st3">${U('الخطوة','Step')} ${step+1} / ${n}</div></div><div class="player"><div class="body">${b}</div><div class="foot" id="foot"><button class="go" id="go" onclick="onGo()" ${(s.t==='teach'||s.t==='run')?'':'disabled'}>${s.t==='teach'?U('يلا','Next'):U('تحقق','Check')}</button></div></div>`,L.id);
  if(s.t==='order')document.querySelectorAll('#toks .tok').forEach(el=>el.onclick=()=>tok(el,el.textContent));
  window.scrollTo(0,0);
}
function ins(t){const e=$('#ed');const a=e.selectionStart,z=e.selectionEnd;e.value=e.value.slice(0,a)+t+e.value.slice(z);e.focus();e.selectionStart=e.selectionEnd=a+t.length}
function showHint(){const s=L.steps[step];$('#hintbox').innerHTML=`<div class="hintbox">💡 ${U('تلميح','Hint')}:<pre>${esc(s.hint)}</pre></div>`}
function pick(i){if(checked)return;sel=i;document.querySelectorAll('.opt').forEach((e,j)=>e.classList.toggle('sel',i===j));$('#go').disabled=false}
function pickB(i){if(checked)return;sel=i;document.querySelectorAll('.chip2').forEach((e,j)=>e.classList.toggle('sel',i===j));const bl=$('#bl');bl.textContent=L.steps[step].opts[i];bl.classList.add('f');$('#go').disabled=false}
function tok(el,x){if(checked)return;el.disabled=true;el.style.opacity=.3;ordered.push(x);const b=document.createElement('button');b.className='tok';b.textContent=x;b.onclick=()=>{if(checked)return;ordered.splice(ordered.indexOf(x),1);b.remove();el.disabled=false;el.style.opacity=1;$('#go').disabled=ordered.length===0};$('#ans').appendChild(b);$('#go').disabled=false}
function onGo(){
  const s=L.steps[step];
  if(checked||s.t==='teach'){return next()}
  let ok=false;
  if(s.t==='mcq'||s.t==='blank'){ok=sel===s.a;document.querySelectorAll('.opt,.chip2').forEach((e,j)=>{if(j===s.a)e.classList.add('ok');else if(j===sel)e.classList.add('bad')})}
  else if(s.t==='order'){ok=JSON.stringify(ordered)===JSON.stringify(s.answer)}
  else if(s.t==='run'){const c=$('#ed').value;ok=!!(ranOk&&s.check(c,lastOut))}
  checked=true;
  const f=$('#foot');
  if(ok){xpGain+=10;sOk();confetti(14);f.className='foot ok';f.innerHTML=`<div class="msg">${rnd(S.lang==='en'?PRAISE_EN:PRAISE_AR)} </div><button class="go" onclick="onGo()">${U('كمّل','Continue')}</button>`}
  else{
    sBad();
    if(s.t==='run'){fails++;f.className='foot bad';f.innerHTML=`<div class="msg">${rnd(S.lang==='en'?COMFORT_EN:COMFORT_AR)}<br><span style="font-size:15px">${ranOk?U('الكود اشتغل بس الناتج مش زي المطلوب. اقرأ السؤال تاني.','The code ran but the output is not what was asked. Read the task again.'):U('اضغط ▶ شغّل الأول وشوف النتيجة.','Press ▶ Run first and check the result.')}</span></div><button class="go" onclick="retry()">${U('جرّب تاني','Try again')}</button>`}
    else{f.className='foot bad';
      f.innerHTML=`<div class="msg">${rnd(S.lang==='en'?COMFORT_EN:COMFORT_AR)}<br><span style="font-size:15px">${U('الإجابة الصح متلوّنة بالأخضر','The correct answer is shown in green')}</span></div><button class="go" onclick="onGo()">${U('كمّل','Continue')}</button>`}}
}
function retry(){checked=false;const f=$('#foot');f.className='foot';f.innerHTML=`<button class="go" id="go" onclick="onGo()">${U('تحقق','Check')}</button>`;if(fails>=2)showHint()}
function next(){step++;if(step>=L.steps.length)return finish();render()}
function finish(){
  const first=!S.done[L.id];S.done[L.id]=true;S.xp+=xpGain+(first?20:0);
  save();
  const dn=flat.filter(l=>S.done[l.id]).length;
  const k=flat.indexOf(L),nx=flat[k+1];
  shell(`<div class="player"><div class="done-s"><div class="big">✔</div><h2>${L.id==='p1'?U('خلّصت المشروع النهائي','Final project complete'):U('خلّصت الدرس','Lesson complete')}</h2><p>${tr(L.title)}</p><div class="stats"><div class="stat">${dn}/${flat.length} ${U('دروس','lessons')}</div></div><div class="fin">${nx?`<button class="go" onclick="startLesson('${nx.id}')">${U('الدرس التالي','Next lesson')}: ${tr(nx.title)}</button>`:''}<button class="go sec2" onclick="home()">${U('صفحة الكورس','Course page')}</button></div></div></div>`,L.id);
}

/* ---------- تشغيل بايثون (Pyodide) ---------- */
let pyP=null;
const PY_MIRRORS=['https://cdn.jsdelivr.net/pyodide/v0.26.4/full/','https://fastly.jsdelivr.net/pyodide/v0.26.4/full/','https://gcore.jsdelivr.net/pyodide/v0.26.4/full/','https://unpkg.com/pyodide@0.26.4/'];
let pyErr='',pyMsg=null;
function pyNote(t){if(pyMsg)pyMsg(t)}
function withTimeout(p,ms,label){return new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error(label+' timeout')),ms);p.then(v=>{clearTimeout(t);res(v)},e=>{clearTimeout(t);rej(e)})})}
function loadScript(src){return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=()=>rej(new Error('script blocked'));document.head.appendChild(sc)})}
function loadPy(){
  if(pyP)return pyP;
  pyP=(async()=>{
    pyErr='';
    for(let i=0;i<PY_MIRRORS.length;i++){
      const base=PY_MIRRORS[i];
      try{
        pyNote(i);
        await withTimeout(loadScript(base+'pyodide.js'),25000,'script');
        const py=await withTimeout(loadPyodide({indexURL:base}),240000,'runtime');
        return py;
      }catch(e){pyErr+=(pyErr?' | ':'')+(new URL(base).hostname)+': '+(e&&e.message||e)}
    }
    throw new Error(pyErr);
  })();
  pyP.catch(()=>{pyP=null});
  return pyP;
}
const ERR={KeyError:'المفتاح مش موجود في القاموس. راجع الاسم بالظبط.',NameError:'اسم مش معروف: يمكن كتبته غلط، أو نسيت تعرّف المتغير، أو نسيت علامات " " حوالين الكلام.',SyntaxError:'الجملة مكتوبة غلط: راجع الأقواس ( ) وعلامات " " والنقطتين : وحروف print الصغيرة.',IndentationError:'المسافات في أول السطر مش مظبوطة. الأسطر اللي تحت if أو for أو def لازم تبدأ بـ 4 مسافات.',TypeError:'نوع غلط: ممكن بتجمع رقم مع كلام، أو نسيت int() على input.',ValueError:'القيمة مش مناسبة: غالبا كتبت كلام في مكان محتاج رقم.',ZeroDivisionError:'مينفعش نقسم على صفر!',IndexError:'رقم المكان أكبر من حجم القائمة. فاكر إن العد بيبدأ من 0.',KeyError:'المفتاح مش موجود.',AttributeError:'الأمر ده مش موجود للنوع ده. راجع اسمه.'};
const ERR_EN={KeyError:'That key is not in the dictionary. Check the exact spelling.',NameError:'Unknown name: maybe a typo, a variable you did not define, or missing quotes around text.',SyntaxError:'The statement is written wrongly: check brackets ( ), quotes, colons : and lowercase print.',IndentationError:'The spaces at the start of the line are wrong. Lines under if, for or def need 4 spaces.',TypeError:'Wrong type: maybe you mixed a number with text, or forgot int()/float() on input.',ValueError:'The value does not fit: usually text where a number is needed.',ZeroDivisionError:'You cannot divide by zero.',IndexError:'The index is bigger than the list. Counting starts at 0.',AttributeError:'That method does not exist for this type. Check its name.'};
async function runCode(){
  const out=$('#out'),st=$('#pystat');
  pyMsg=i=>{st.textContent=U('⏳ بيحمّل بايثون (حوالي 12 ميجا، أول مرة بس، ممكن ياخد دقيقة على النت البطيء)...','⏳ Downloading Python (about 12 MB, first time only, can take a minute on slow internet)...')+(i>0?' ['+(i+1)+'/'+PY_MIRRORS.length+']':'')};pyMsg(0);
  let py;
  try{py=await loadPy()}catch(e){st.textContent='';out.className='out err';out.textContent=U('مش قادر يحمّل بايثون. جرّب تضغط ▶ شغّل تاني، أو غيّر الشبكة (واي فاي أو داتا).','Could not load Python. Press ▶ Run again, or switch network (Wi-Fi or mobile data).')+'\n('+(e&&e.message||'')+')';ranOk=false;return}
  st.textContent='';
  let buf='';
  py.setStdout({batched:x=>buf+=x+'\n'});
  py.setStderr({batched:x=>buf+=x+'\n'});
  const ask=window.__inputs;
  py.setStdin({stdin:()=>{if(ask&&ask.length)return ask.shift();const r=window.prompt(U('اكتب إجابتك:','Type your answer:'));return r===null?'':r}});
  const code=$('#ed').value;
  try{
    await py.runPythonAsync(code);
    out.className='out';out.textContent=buf||U('(البرنامج اشتغل ومطبعش حاجة. استخدم print)','(The program ran but printed nothing. Use print)');ranOk=true;lastOut=buf;
  }catch(e){
    const m=String(e.message||e).split('\n').filter(x=>x.trim());const last=m[m.length-1];
    const ln=(String(e.message).match(/File "<exec>", line (\d+)/g)||[]).pop();
    const kind=(last.match(/^(\w+Error)/)||[])[1];
    out.className='out err';
    out.innerHTML=(kind&&ERR[kind]?`<div class="errhelp" dir="${S.lang==='en'?'ltr':'rtl'}">❗ ${(S.lang==='en'?ERR_EN:ERR)[kind]}${ln?U(' (في السطر ',' (line ')+ln.match(/\d+/)[0]+')':''}</div>`:'')+esc(buf)+esc(last);
    ranOk=false;lastOut=buf;
  }
}
